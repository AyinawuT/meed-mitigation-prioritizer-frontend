name: Dev - Push frontend to GHCR and deploy to EKS

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/meed-mitigation-prioritizer-frontend-develop.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/meed-mitigation-prioritizer-frontend-develop.yml"
    types: [opened, synchronize, reopened]

# Notes:
# - This workflow runs for both PRs targeting `develop` and pushes to `develop`.
# - Only pushes to `develop` can run deploy (that job is gated by `if: github.ref == 'refs/heads/develop'`).
# - Concurrency is intentionally scoped so PR validation runs cannot cancel deploy-capable push runs.
concurrency:
  group: meed-mitigation-prioritizer-frontend-develop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      REPOSITORY: open-earth-foundation/meed-mitigation-prioritizer-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        env:
          PORT: "8000"
          VITE_PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: "production"
        run: npm run build --workspace=@workspace/hiap

      - name: Build API server
        working-directory: app
        run: npm run build --workspace=@workspace/api-server
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/develop'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Git commit hash
        if: github.ref == 'refs/heads/develop'
        id: vars
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push image
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v5
        with:
          context: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ steps.vars.outputs.commit_hash }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:dev

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_EKS_DEV_USER }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_EKS_DEV_USER }}
      EKS_DEV_NAME: ${{ secrets.EKS_DEV_NAME }}
      IMAGE: ghcr.io/open-earth-foundation/meed-mitigation-prioritizer-frontend:dev
    steps:
      - uses: actions/checkout@v4

      - name: Creating kubeconfig file
        run: aws eks update-kubeconfig --name ${{secrets.EKS_DEV_NAME}} --region us-east-1

      - name: Testing connection to EKS
        run: kubectl get pods -n default

      - name: Deploying development service
        run: |
          kubectl apply -f k8s/deployment-dev.yml
          kubectl apply -f k8s/service-dev.yml

          kubectl set image deployment/meed-mitigation-prioritizer-frontend-dev \
            meed-mitigation-prioritizer-frontend-dev=$IMAGE \
            -n default

          kubectl rollout restart deployment meed-mitigation-prioritizer-frontend-dev -n default
          kubectl rollout status deployment/meed-mitigation-prioritizer-frontend-dev -n default
