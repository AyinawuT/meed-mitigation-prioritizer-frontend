[[services]]
localPort = 3000
name = "API Server"
paths = ["/"]

[services.development]
run = "bash -c 'PATH=/nix/store/bl6iwirn83qj9r8wng43kfdqd5mfahj8-nodejs-22.22.0/bin:$PATH node --enable-source-maps /home/runner/workspace/artifacts/api-server/dist/index.mjs'"

[services.production]

[services.production.build]
args = ["bash", "-c", "PATH=/nix/store/bl6iwirn83qj9r8wng43kfdqd5mfahj8-nodejs-22.22.0/bin:$PATH node app/artifacts/api-server/build.mjs && cd app/artifacts/hiap && PORT=20040 BASE_PATH=/ PATH=/nix/store/bl6iwirn83qj9r8wng43kfdqd5mfahj8-nodejs-22.22.0/bin:$PATH node node_modules/vite/bin/vite.js build --config vite.config.ts"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["bash", "-c", "PATH=/nix/store/s7awkfc4pym4zj139fsxrjs5xwf5hhnd-nodejs-24.13.0-wrapped/bin:$PATH exec node --enable-source-maps app/artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
