apiVersion: apps/v1
kind: Deployment
metadata:
  name: meed-mitigation-prioritizer-frontend-dev
  namespace: default
  labels:
    app: meed-mitigation-prioritizer-frontend-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meed-mitigation-prioritizer-frontend-dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: meed-mitigation-prioritizer-frontend-dev
    spec:
      containers:
        - name: meed-mitigation-prioritizer-frontend-dev
          image: ghcr.io/open-earth-foundation/meed-mitigation-prioritizer-frontend:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8000"
            - name: HIAP_API_URL
              value: "http://hiap-meed-service-dev"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
