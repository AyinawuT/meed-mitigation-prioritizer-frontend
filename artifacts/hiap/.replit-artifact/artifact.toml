kind = "web"
previewPath = "/"
title = "HIAP — Climate Action Prioritizer"
version = "1.0.0"
id = "artifacts/hiap"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20040

[services.development]
run = "pnpm --filter @workspace/hiap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hiap", "run", "build" ]
publicDir = "artifacts/hiap/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20040"
BASE_PATH = "/"
